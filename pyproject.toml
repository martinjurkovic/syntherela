[build-system]
requires = ['setuptools', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = "syntherela"
version = "0.3.0"
dependencies = [
    "sdmetrics>=0.21.0",
    "graphviz>=0.13.2",
    "seaborn==0.13.2",
    "xgboost==1.7.6",
    "scikit-learn>1.3.1,<1.5"
]
authors = [
  { name="Martin Jurkovic", email="martin.jurkovic19@gmail.com" },
  { name="Valter Hudovernik", email="valter.hudovernik@gmail.com" },
]
description = "SyntheRela - Synthetic Relational Data Generation Benchmark"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["python", "syntherela", "synthetic data", "relational data", "evaluation", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Healthcare Industry"
    ]

[project.optional-dependencies]
sdv = [
    "sdv>=1.9.0,<2",
]

dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ty==0.0.25",
]

docs=[
	"sphinx>=8.0.0",
	"sphinx-rtd-theme>=3.0.0",
	"sphinx-autodoc-typehints>=3.0.0",
]

rdl-utility=[
  "relbench[full,example]@git+https://github.com/snap-stanford/relbench.git@main",
  "torch_geometric==2.6.1",
  "tqdm",
  "lightgbm==4.6.0",
  "featuretools==1.31.0",
]

privacy=[
  "syntheval"
]

[project.urls]
Homepage = "https://github.com/martinjurkovic/syntherela"
Issues = "https://github.com/martinjurkovic/syntherela/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 80
target-version = "py310"
src = ["syntherela"]

[tool.ty.src]
include = ["syntherela", "tests"]

[tool.ruff.lint]
preview = true
select = [
  "E",   # Flake8/PEP8
  "W",   # Flake8/PEP8
  "F",   # Pyflakes
  "I",   # isort (Import sorting)
  "B",   # Bugbear
  "D",   # pydocstyle
  "DOC", # pydoclint
  "UP",  # pyupgrade
]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D205",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"experiments/**/*.py" = ["E501", "DOC"]
"tests/**/*.py" = ["DOC"]

[tool.ruff.format]
# Matches your current YAPF/PyG style
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--capture=no",
    "--color=yes",
    "-vv",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: end-to-end or multi-component tests",
    "network: requires network access",
]

[tool.coverage.run]
source = ["syntherela"]
omit = [
    "*tests*",
    "*docs*",
    "experiments/*",
    "*.ipynb",
    "syntherela/visualisations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
fail_under = 85
