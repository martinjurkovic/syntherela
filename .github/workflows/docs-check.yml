# Build and check docs on PRs (broken build or links fail the check)
name: docs-check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'syntherela/**'
      - 'README.md'
      - 'pyproject.toml'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Build Sphinx docs
        run: make -C docs html

      - name: Linkcheck (broken external links)
        run: make -C docs linkcheck
